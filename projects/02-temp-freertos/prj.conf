CONFIG_MCUX_COMPONENT_middleware.freertos-kernel=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y
CONFIG_MCUX_PRJSEG_middleware.freertos-kernel.generated_config=y
CONFIG_configINCLUDE_FREERTOS_TASK_C_ADDITIONS_H=y
CONFIG_configRUN_FREERTOS_SECURE_ONLY=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.extension=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.config=y
# FreeRTOS kernel, Cortex-M33 without TrustZone (same line NXP's freertos_queue example uses)
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm33_non_trustzone=y

# FlexComm I2C driver (the temperature sensor is on FC2) and what NXP's I2C examples enable
CONFIG_MCUX_COMPONENT_driver.flexcomm_i2c=y
CONFIG_MCUX_COMPONENT_driver.inputmux=y

# Freestanding project: we bring our own hardware_init.c and app.h
# (these three lines come from NXP's "MCUXpresso SDK Integration" doc)
CONFIG_MCUX_HAS_PRJSEG_project.use_hw_app=n
CONFIG_MCUX_PRJSEG_project.hw_app_project_folder=n
CONFIG_MCUX_PRJSEG_module.board.pinmux_board_folder=y
