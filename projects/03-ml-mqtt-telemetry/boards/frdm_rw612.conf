# Copied from Zephyr's samples/net/wifi/shell/boards/frdm_rw612.conf (Apache-2.0, NXP),
# with a larger main stack because main() runs the MQTT client.
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y
CONFIG_ETH_DRIVER=n

# stack sizes
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_IDLE_STACK_SIZE=1024
